name: CI

# The backend and browser suites both need a real Hermes checkout on sys.path
# (tests/conftest.py imports agent.secret_scope; tests/real_app.py imports
# hermes_constants / hermes_cli). Without it every pytest test errors at set-up
# and the browser suite cannot start its real backend — that is a hard failure,
# not a skip. Both jobs below clone the pinned tested revision for this.
#
# A bare clone is all that is needed: the adapter's runtime probe is
# CAPABILITY-based (every required public seam must import and be callable), so
# there is no install-stamp.json to write and no version string to compare. See
# CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_TESTED_TAG: v0.22.2+canary.20261020T065957Z
  HERMES_TESTED_SHA: c5a3c0f8767a72203363d249add14142dbcf3cc7

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The Hermes checkout the suite imports requires Python >=3.11.
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set isolated test paths
        run: printf 'HERMES_MODEL_SWITCHER_HERMES_REPO=%s/hermes-agent\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install plugin test dependencies
        run: python -m pip install -e '.[test]'

      - name: Fetch the pinned Hermes reference checkout
        run: |
          git init "$HERMES_MODEL_SWITCHER_HERMES_REPO"
          git -C "$HERMES_MODEL_SWITCHER_HERMES_REPO" remote add origin \
            https://github.com/NousResearch/hermes-agent.git
          git -C "$HERMES_MODEL_SWITCHER_HERMES_REPO" fetch --depth 1 origin "$HERMES_TESTED_SHA"
          git -C "$HERMES_MODEL_SWITCHER_HERMES_REPO" checkout -q FETCH_HEAD
          test "$(git -C "$HERMES_MODEL_SWITCHER_HERMES_REPO" rev-parse HEAD)" = "$HERMES_TESTED_SHA"

      # A bare clone needs no install stamp: gating is capability-based.
      - name: Run the backend suite
        run: python -m pytest tests/ -q

  browser:
    name: browser (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Node >=18 is the effective floor (esbuild); package.json declares no engines.
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set isolated test paths
        run: printf 'HERMES_MODEL_SWITCHER_HERMES_REPO=%s/hermes-agent\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python (real backend for the browser suite)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install plugin test dependencies
        run: python -m pip install -e '.[test]'

      - name: Fetch the pinned Hermes reference checkout
        run: |
          git init "$HERMES_MODEL_SWITCHER_HERMES_REPO"
          git -C "$HERMES_MODEL_SWITCHER_HERMES_REPO" remote add origin \
            https://github.com/NousResearch/hermes-agent.git
          git -C "$HERMES_MODEL_SWITCHER_HERMES_REPO" fetch --depth 1 origin "$HERMES_TESTED_SHA"
          git -C "$HERMES_MODEL_SWITCHER_HERMES_REPO" checkout -q FETCH_HEAD
          test "$(git -C "$HERMES_MODEL_SWITCHER_HERMES_REPO" rev-parse HEAD)" = "$HERMES_TESTED_SHA"

      - name: Install Node dependencies
        run: npm ci

      - name: Build the Dashboard bundle
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Bare `npm test` shares real-server.mjs's interpreter resolver:
      # HMS_PYTHON override, local .venv/bin/python, then python3 on PATH.
      - name: Run the browser suite
        run: npm test

  package:
    name: package build (Python 3.10, declared floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install plugin test dependencies
        run: python -m pip install -e '.[test]'

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          src dashboard hermes_adapter.py route_inventory.py __init__.py

      - name: Install Node dependencies and build the UI
        run: |
          npm ci
          npm run build

      # The committed bundle is what a git install loads; fail on drift instead
      # of shipping stale dashboard/dist assets.
      - name: Verify committed bundles match a fresh build
        run: |
          git diff --exit-code -- dashboard/dist \
            || { echo "::error::dashboard/dist is stale — run npm run build and commit the rebuilt assets"; exit 1; }

      - name: Privacy gate
        run: python scripts/privacy_guard.py
