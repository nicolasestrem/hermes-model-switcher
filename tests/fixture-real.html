<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model Switcher fixture — real router</title>
<style>
  body { background: #16181d; color: #e6e8ee; font-family: system-ui, sans-serif; margin: 0; }
  /* Host Tailwind preflight: fixtures must not supply missing plugin chrome. */
  *, ::before, ::after { box-sizing: border-box; border: 0 solid; margin: 0; padding: 0; }
  button, input, select, textarea { font: inherit; color: inherit; background: transparent; border-radius: 0; }

  table { font-size: 0.9em; }
  td, th { padding: 4px; }
</style>
<link rel="stylesheet" href="dashboard/dist/style.css">
</head>
<body>
  <main data-testid="dashboard-main">
    <div data-plugin-root="hermes-model-switcher"></div>
  </main>
  <script src="tests/vendor.js"></script>
  <script>
    // Minimal shell transport over the real, same-origin lab routes. Resolve
    // window.fetch at call time, just like the SDK fixture (no API responses
    // are synthesized here, including host confirmation/error payloads).
    window.__realSdkCalls = [];
    window.__HERMES_PLUGIN_SDK__ = {
      React: window.React,
      ReactDOM: window.ReactDOM,
      authedFetch: (url, init) => {
        window.__realSdkCalls.push({ url: String(url), method: init?.method || "GET" });
        return window.fetch(url, init);
      },
      async fetchJSON(url, init) {
        const response = await this.authedFetch(url, init);
        const body = await response.json();
        if (!response.ok) {
          const error = new Error(String(response.status));
          error.status = response.status;
          throw error;
        }
        return body;
      },
    };
  </script>
  <script src="ui/dist/plugin.js"></script>
</body>
</html>
