<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model Switcher fixture</title>
<style>
  body { background: #16181d; color: #e6e8ee; font-family: system-ui, sans-serif; margin: 0; }
  /* Host Tailwind preflight: fixtures must not supply missing plugin chrome. */
  *, ::before, ::after { box-sizing: border-box; border: 0 solid; margin: 0; padding: 0; }
  button, input, select, textarea { font: inherit; color: inherit; background: transparent; border-radius: 0; }

  table { font-size: 0.9em; }
  td, th { padding: 4px; }
</style>
<link rel="stylesheet" href="dashboard/dist/style.css">
<script>window.__mockApi = { failState: false, failReadback: false, failUndo: false, failSavePreset: false, failStateHttp: false };</script>
<script src="tests/mock-api.js"></script>
</head>
<body>
  <main data-testid="dashboard-main">
    <div data-plugin-root="hermes-model-switcher"></div>
  </main>
  <script src="tests/vendor.js"></script>
  <script>
    // Even the standalone mount uses authenticated host transport. The mock
    // refuses host calls lacking this synthetic session header.
    window.__HERMES_PLUGIN_SDK__ = {
      fetchJSON: async (url, init) => {
        const res = await fetch(url, { ...init, headers: {
          ...init?.headers, "X-Hermes-Session-Token": "fixture-session"
        }});
        if (!res.ok) { const error = new Error("Host request refused"); error.status = res.status; throw error; }
        return res.json();
      }
    };
  </script>
  <script src="ui/dist/plugin.js"></script>
</body>
</html>
