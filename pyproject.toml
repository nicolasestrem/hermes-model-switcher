[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-model-switcher"
version = "0.1.0"
description = "Choose models across Hermes profiles, preview changes, and reuse your setup with presets."
license = { text = "MIT" }
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "PyYAML>=6",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1",
    "requests>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
