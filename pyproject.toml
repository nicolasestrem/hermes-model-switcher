[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-model-switcher"
version = "0.3.0"
description = "Choose models across Hermes profiles, preview changes, and reuse your setup with presets."
license = { text = "MIT" }
requires-python = ">=3.10"
# Runtime dependency (not test-only): src/model_switcher/adapters.py and
# src/model_switcher/registry/scanner.py import yaml at runtime to parse
# profile configs. The pinned Hermes itself depends on ruamel.yaml, not
# PyYAML, so this dependency must be declared here by the plugin.
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "fastapi>=0.115",
    # httpx is the TestClient transport (fastapi.testclient imports it); no
    # test imports it directly, but it is required at test runtime.
    "httpx>=0.27",
    "uvicorn>=0.30",
    # The real-backend tests mount Hermes' own /api/model/* routers from the
    # reference checkout; Hermes imports these at module load (hermes_cli
    # config/env loading). The plugin itself never imports them.
    "ruamel.yaml>=0.18",
    "python-dotenv>=1",
    "requests>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
