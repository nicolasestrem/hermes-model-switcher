name: hermes-model-switcher
display_name: Model Switcher
version: 0.1.0
description: Reviewed provider/model preset application across profiles. In-process Dashboard writes only; hosted-isolation mode is read-only.
# The plugin currently ships no CLI/gateway hooks: its only code surface is
# the Dashboard extension (dashboard/manifest.json + dist/index.js + the
# FastAPI backend below, mounted at api_prefix by the Dashboard).
entrypoint: dashboard/plugin_api.py
backend: dashboard/plugin_api.py
api_prefix: /api/plugins/hermes-model-switcher
permissions: [profiles.read, models.read, models.write, operations.journal]
