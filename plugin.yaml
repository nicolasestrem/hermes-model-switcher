manifest_version: 1
name: hermes-model-switcher
version: 0.1.0
description: "Reviewed provider/model preset application across profiles. In-process Dashboard writes only; hosted-isolation mode is read-only."
kind: standalone
# No CLI/gateway surface. The only code surface is the Dashboard extension
# (dashboard/manifest.json + dashboard/dist/index.js + dashboard/plugin_api.py,
# mounted by the Dashboard at /api/plugins/hermes-model-switcher/) — the
# backend path is declared by dashboard/manifest.json's "api" field, not here.
# The root __init__.py is the entry point Hermes requires beside this manifest;
# there are no tools, hooks or commands to declare.
